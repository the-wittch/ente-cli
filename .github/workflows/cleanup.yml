name: Cleanup Docker Hub Tags

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old tags (keep latest + last 3 sha)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: wittchy/ente-cli
        run: |
          # Step 1: Get JWT token
          JWT=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"$DOCKERHUB_USERNAME\", \"password\": \"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/ \
            | jq -r '.token')

          if [ "$JWT" = "null" ] || [ -z "$JWT" ]; then
            echo "ERROR: Failed to authenticate with Docker Hub"
            exit 1
          fi
          echo "Authenticated successfully"

          # Step 2: Get all tags sorted by last_updated (newest first)
          TAGS=$(curl -s \
            -H "Authorization: JWT $JWT" \
            "https://hub.docker.com/v2/repositories/$REPO/tags/?page_size=100&ordering=-last_updated" \
            | jq -r '.results[].name')

          # Step 3: Keep latest + last 3, delete the rest
          KEEP=0
          while IFS= read -r name; do
            if [ "$name" = "latest" ]; then
              echo "Keeping: $name"
              continue
            fi

            if [ "$KEEP" -lt 3 ]; then
              KEEP=$((KEEP + 1))
              echo "Keeping: $name"
            else
              echo "Deleting: $name"
              curl -s -X DELETE \
                -H "Authorization: JWT $JWT" \
                "https://hub.docker.com/v2/repositories/$REPO/tags/$name/"
            fi
          done <<< "$TAGS"   
