name: Cleanup Docker Hub Tags

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old tags and their manifests
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: wittchy/ente-cli
          KEEP_RECENT: 6
        run: |
          set -euo pipefail

          ACCEPT="application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json"
          REGISTRY="https://registry-1.docker.io/v2/$REPO"
          HUB="https://hub.docker.com/v2/repositories/$REPO"

          TAGS_DELETED=0
          MANIFESTS_DELETED=0
          FAILURES=0

          JWT=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}' \
            | curl -fsS -X POST -H "Content-Type: application/json" --data @- https://hub.docker.com/v2/users/login/ \
            | jq -r '.token // empty')
          [ -n "$JWT" ] || { echo "ERROR: Docker Hub login failed" >&2; exit 1; }

          REG_TOKEN=$(curl -fsS -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull,delete" \
            | jq -r '.token // empty')
          [ -n "$REG_TOKEN" ] || { echo "ERROR: registry login failed" >&2; exit 1; }

          TAGS=()
          URL="$HUB/tags/?page_size=100&ordering=-last_updated"
          while [ -n "$URL" ]; do
            RESP=$(curl -fsS -H "Authorization: JWT $JWT" "$URL")
            mapfile -t -O "${#TAGS[@]}" TAGS < <(jq -r '.results[]?.name // empty' <<<"$RESP")
            URL=$(jq -r '.next // empty' <<<"$RESP")
          done
          echo "Found ${#TAGS[@]} tag(s)"

          resolve_digests() {
            local headers body digest media
            headers=$(mktemp)
            body=$(curl -fsS -D "$headers" -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
              "$REGISTRY/manifests/$1") || { rm -f "$headers"; return 1; }
            digest=$(tr -d '\r' <"$headers" | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2; exit}')
            media=$(tr -d '\r' <"$headers" | awk -F': ' 'tolower($1)=="content-type"{print $2; exit}')
            rm -f "$headers"
            [ -n "$digest" ] || return 1
            printf '%s\n' "$digest"
            case "$media" in
              *manifest.list.v2+json*|*image.index.v1+json*)
                jq -r '.manifests[]?.digest // empty' <<<"$body" ;;
            esac
          }

          KEEP=()
          DOOMED=()
          recent=0
          for name in "${TAGS[@]}"; do
            case "$name" in
              latest|cli-v*|v*) KEEP+=("$name"); continue ;;
            esac
            if [ "$recent" -lt "$KEEP_RECENT" ]; then
              recent=$((recent + 1))
              KEEP+=("$name")
            else
              DOOMED+=("$name")
            fi
          done
          echo "Keeping: ${KEEP[*]:-none}"
          echo "Deleting: ${DOOMED[*]:-none}"
          [ "${#DOOMED[@]}" -gt 0 ] || exit 0

          # a registry delete drops every tag on that digest, and rebuilds of the same source reuse digests
          declare -A PROTECTED=()
          for name in "${KEEP[@]}"; do
            digests=$(resolve_digests "$name") || {
              echo "ERROR: could not resolve kept tag $name; refusing to delete anything" >&2
              exit 1
            }
            while IFS= read -r d; do PROTECTED[$d]=1; done <<<"$digests"
          done

          for name in "${DOOMED[@]}"; do
            echo "Deleting $name"
            digests=$(resolve_digests "$name") || {
              echo "  WARN: could not resolve digests; deleting the Hub tag only"
              FAILURES=$((FAILURES + 1))
              digests=""
            }

            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT $JWT" "$HUB/tags/${name}/" || echo 000)
            case "$code" in
              200|202|204) TAGS_DELETED=$((TAGS_DELETED + 1)) ;;
              404) ;;
              *) echo "  Hub tag delete failed ($code)"; FAILURES=$((FAILURES + 1)) ;;
            esac

            while IFS= read -r d; do
              [ -n "$d" ] || continue
              if [ -n "${PROTECTED[$d]:-}" ]; then
                echo "  kept $d (still used by a kept tag)"
                continue
              fi
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $REG_TOKEN" "$REGISTRY/manifests/$d" || echo 000)
              case "$code" in
                200|202) MANIFESTS_DELETED=$((MANIFESTS_DELETED + 1)) ;;
                403|404|405) echo "  skipped $d ($code)" ;;
                *) echo "  manifest delete failed ($code): $d"; FAILURES=$((FAILURES + 1)) ;;
              esac
            done <<<"$digests"
          done

          echo "Tags deleted: $TAGS_DELETED, manifests deleted: $MANIFESTS_DELETED, warnings: $FAILURES"
