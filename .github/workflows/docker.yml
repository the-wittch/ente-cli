name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: docker-build
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve latest upstream cli-v* tag
        id: upstream
        run: |
          TAG=$(git ls-remote --tags https://github.com/ente-io/ente.git 'refs/tags/cli-v*' \
            | grep -v '\^{}' \
            | sed 's#.*refs/tags/##' \
            | sort -V \
            | tail -1)
          if [ -z "$TAG" ]; then
            echo "ERROR: no cli-v* tags found on ente-io/ente" >&2
            exit 1
          fi

          SHA=$(git ls-remote https://github.com/ente-io/ente.git "refs/tags/${TAG}" | awk '{print $1}')
          VERSION="${TAG#cli-}"

          {
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream release: $TAG ($SHA) version=$VERSION"

      - name: Restore last built upstream tag
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .last-built-upstream-tag
          key: last-built-upstream-tag-${{ steps.upstream.outputs.tag }}
          restore-keys: |
            last-built-upstream-tag-

      - name: Check if changed
        id: changed
        run: |
          UPSTREAM_TAG="${{ steps.upstream.outputs.tag }}"
          LAST_TAG=""
          if [ -f .last-built-upstream-tag ]; then
            LAST_TAG=$(cat .last-built-upstream-tag)
          elif [ -f UPSTREAM_TAG ]; then
            LAST_TAG=$(cat UPSTREAM_TAG)
          fi
          echo "Last built: ${LAST_TAG:-none}"
          echo "Current:    $UPSTREAM_TAG"

          if [ "$UPSTREAM_TAG" = "$LAST_TAG" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new cli-v* release — skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test
        if: steps.changed.outputs.changed == 'true'
        run: ./scripts/smoke-test.sh

      - name: Set up QEMU
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            UPSTREAM_REF=${{ steps.upstream.outputs.tag }}
            VERSION=${{ steps.upstream.outputs.version }}
          tags: |
            wittchy/ente-cli:latest
            wittchy/ente-cli:${{ steps.upstream.outputs.tag }}
            wittchy/ente-cli:${{ steps.upstream.outputs.version }}
            wittchy/ente-cli:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub overview
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: wittchy/ente-cli
          short-description: Ente CLI with scheduled loop or cron exports, hardened non-root Alpine image
          enable-url-completion: true

      - name: Record last built upstream tag
        if: steps.changed.outputs.changed == 'true'
        run: echo "${{ steps.upstream.outputs.tag }}" > .last-built-upstream-tag

      - name: Save last built upstream tag
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .last-built-upstream-tag
          key: last-built-upstream-tag-${{ steps.upstream.outputs.tag }}

      - name: Stage UPSTREAM_TAG update
        id: pin
        if: steps.changed.outputs.changed == 'true'
        run: |
          NEW_TAG="${{ steps.upstream.outputs.tag }}"
          OLD_TAG=""
          if [ -f UPSTREAM_TAG ]; then
            OLD_TAG=$(cat UPSTREAM_TAG)
          fi

          if [ "$NEW_TAG" = "$OLD_TAG" ]; then
            echo "UPSTREAM_TAG already current."
            echo "needs_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NEW_TAG" > UPSTREAM_TAG
            echo "needs_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR to update UPSTREAM_TAG
        if: steps.changed.outputs.changed == 'true' && steps.pin.outputs.needs_pr == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update upstream tag to ${{ steps.upstream.outputs.tag }}"
          title: "chore: update upstream tag to ${{ steps.upstream.outputs.tag }}"
          body: |
            Automated bump of `UPSTREAM_TAG` after a successful image build.

            - Upstream tag: [`${{ steps.upstream.outputs.tag }}`](https://github.com/ente-io/ente/releases/tag/${{ steps.upstream.outputs.tag }})
            - Commit: `${{ steps.upstream.outputs.sha }}`
            - Image tags: `wittchy/ente-cli:${{ steps.upstream.outputs.tag }}`, `wittchy/ente-cli:${{ steps.upstream.outputs.version }}`

            This PR only updates the pin used for local builds and docs.
            The published image already includes this release.
          branch: chore/upstream-tag
          delete-branch: true
          add-paths: |
            UPSTREAM_TAG
