name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: docker-build
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream SHA
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/ente-io/ente.git refs/heads/main | awk '{print $1}')
          SHORT_SHA="${SHA:0:12}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream ente-io/ente HEAD: $SHA"

      - name: Restore last built upstream SHA
        uses: actions/cache/restore@v4
        with:
          path: .last-built-upstream-sha
          key: last-built-upstream-sha-${{ steps.upstream.outputs.sha }}
          restore-keys: |
            last-built-upstream-sha-

      - name: Check if changed
        id: changed
        run: |
          UPSTREAM_SHA="${{ steps.upstream.outputs.sha }}"
          LAST_SHA=""
          if [ -f .last-built-upstream-sha ]; then
            LAST_SHA=$(cat .last-built-upstream-sha)
          elif [ -f UPSTREAM_SHA ]; then
            LAST_SHA=$(cat UPSTREAM_SHA)
          fi
          echo "Last built: ${LAST_SHA:-none}"
          echo "Current:    $UPSTREAM_SHA"

          # Always build on push/workflow_dispatch; skip on schedule if unchanged
          if [ "$UPSTREAM_SHA" = "$LAST_SHA" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes — skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            UPSTREAM_SHA=${{ steps.upstream.outputs.sha }}
            VERSION=${{ steps.upstream.outputs.short_sha }}
          tags: |
            wittchy/ente-cli:latest
            wittchy/ente-cli:${{ github.sha }}
            wittchy/ente-cli:upstream-${{ steps.upstream.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record last built upstream SHA
        if: steps.changed.outputs.changed == 'true'
        run: echo "${{ steps.upstream.outputs.sha }}" > .last-built-upstream-sha

      - name: Save last built upstream SHA
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .last-built-upstream-sha
          key: last-built-upstream-sha-${{ steps.upstream.outputs.sha }}

      - name: Stage UPSTREAM_SHA update
        id: pin
        if: steps.changed.outputs.changed == 'true'
        run: |
          NEW_SHA="${{ steps.upstream.outputs.sha }}"
          OLD_SHA=""
          if [ -f UPSTREAM_SHA ]; then
            OLD_SHA=$(cat UPSTREAM_SHA)
          fi

          if [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "UPSTREAM_SHA already current."
            echo "needs_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NEW_SHA" > UPSTREAM_SHA
            echo "needs_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR to update UPSTREAM_SHA
        if: steps.changed.outputs.changed == 'true' && steps.pin.outputs.needs_pr == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update upstream SHA to ${{ steps.upstream.outputs.sha }}"
          title: "chore: update upstream SHA to ${{ steps.upstream.outputs.short_sha }}"
          body: |
            Automated bump of `UPSTREAM_SHA` after a successful image build.

            - Upstream: [`${{ steps.upstream.outputs.sha }}`](https://github.com/ente-io/ente/commit/${{ steps.upstream.outputs.sha }})
            - Image tag: `wittchy/ente-cli:upstream-${{ steps.upstream.outputs.short_sha }}`

            This PR only updates the pin used for local builds and docs.
            The published image already includes this commit.
          branch: chore/upstream-sha
          delete-branch: true
          add-paths: |
            UPSTREAM_SHA
