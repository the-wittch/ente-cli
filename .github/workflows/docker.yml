name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream SHA
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/ente-io/ente.git refs/heads/main | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream ente-io/ente HEAD: $SHA"

      - name: Check if changed
        id: changed
        run: |
          UPSTREAM_SHA="${{ steps.upstream.outputs.sha }}"
          LAST_SHA=""
          if [ -f UPSTREAM_SHA ]; then
            LAST_SHA=$(cat UPSTREAM_SHA)
          fi
          echo "Last built: ${LAST_SHA:-none}"
          echo "Current:    $UPSTREAM_SHA"

          # Always build on manual push, skip on schedule if unchanged
          if [ "$UPSTREAM_SHA" = "$LAST_SHA" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes — skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            wittchy/ente-cli:latest
            wittchy/ente-cli:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update upstream SHA
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > UPSTREAM_SHA
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_SHA
          git commit -m "chore: update upstream SHA to ${{ steps.upstream.outputs.sha }}"
          git push
  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Delete old tags (keep latest + last 3 sha)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: wittchy/ente-cli
        run: |
          # Get all tags sorted by last_updated (newest first)
          TAGS=$(curl -s -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            "https://hub.docker.com/v2/repositories/$REPO/tags?page_size=100" \
            | jq -r '.results[] | "\(.name) \(.id)"')
  
          # Count sha tags to keep (exclude "latest")
          KEEP=0
  
          while read -r name id; do
            if [ "$name" = "latest" ]; then
              continue
            fi
  
            if [ "$KEEP" -lt 3 ]; then
              KEEP=$((KEEP + 1))
              echo "Keeping: $name"
            else
              echo "Deleting: $name"
              curl -s -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
                -X DELETE "https://hub.docker.com/v2/repositories/$REPO/tags/$id"
            fi
          done <<< "$TAGS"
  
